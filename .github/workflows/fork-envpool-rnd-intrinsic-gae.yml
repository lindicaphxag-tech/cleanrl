name: PyTorch EnvPool RND continuing-GAE compressed trajectory oracle
on:
  push:
    branches: [fix/ppo-envpool-dummy-transition-loss-20261014]
    paths:
      - cleanrl/ppo_rnd_envpool.py
      - cleanrl_utils/envpool_rnd_gae.py
      - tests/test_envpool_rnd_intrinsic_gae.py
      - .github/workflows/fork-envpool-rnd-intrinsic-gae.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-compressed-trajectory-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU arithmetic dependency
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Validate source syntax and 400 scalar reference trajectory comparisons
        run: |
          python -m py_compile cleanrl/ppo_rnd_envpool.py cleanrl_utils/envpool_rnd_gae.py
          python -m pytest -q tests/test_envpool_dummy_transition_mask.py tests/test_envpool_rnd_intrinsic_gae.py
