name: Pure EnvPool reset-dummy and real PyTorch gradient tests
on:
  push:
    branches: [fix/ppo-envpool-dummy-transition-loss-20261014]
    paths:
      - cleanrl/ppo_atari_envpool.py
      - cleanrl_utils/envpool_dummy_steps.py
      - tests/test_envpool_dummy_transition_mask.py
      - .github/workflows/fork-envpool-dummy-gradient-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-policy-critic-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest torch --index-url https://pypi.org/simple
      - run: python -m py_compile cleanrl/ppo_atari_envpool.py cleanrl_utils/envpool_dummy_steps.py
      - run: python -m pytest -q tests/test_envpool_dummy_transition_mask.py
